name: Fork guard

# FORK-01: the `upstream` branch only mirrors QuantumNous/new-api.
# FORK-02: PRs into `main` that touch upstream files must update PATCHES.md.
on:
  push:
    branches: [upstream, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upstream-mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upstream'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Branch must be contained in upstream history
        run: |
          git fetch --no-tags https://github.com/QuantumNous/new-api.git main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::upstream branch contains commits that are not in QuantumNous/new-api main"
            exit 1
          fi

  patch-registry:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Upstream file changes require a PATCHES.md update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          upstream_changes=$(printf '%s\n' "$changed" | grep -Ev \
            '^(PATCHES\.md|FORK_VERSION|UPSTREAM_COMMIT|scripts/fork-[^/]*|\.github/workflows/fork-[^/]*|test/contract/.*|.*_fork\.go|.*_fork_test\.go)$' || true)
          if [ -n "$upstream_changes" ] && ! printf '%s\n' "$changed" | grep -qx 'PATCHES.md'; then
            echo "::error::These upstream files changed without a PATCHES.md update:"
            printf '%s\n' "$upstream_changes"
            exit 1
          fi

  # FORK-03: DEP-01 … DEP-05 contract tests gate every change to main.
  contract:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
      TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql
      TEST_BILLING_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      TEST_BILLING_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Create frontend embed placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Fork version format
        run: go test ./common/ -run Fork -count=1
      - name: Contract tests (SQLite, PostgreSQL, MySQL)
        run: go test ./test/contract/ -count=1 -v
      - name: Durable billing and subscription cycles (SQLite, PostgreSQL, MySQL)
        run: |
          go test ./model -run '^TestSubscriptionCycle' -count=1 -v -timeout 300s
          go test ./service -run '^TestBillingRecovery' -count=1 -v -timeout 300s
      - name: Real controller billing policy and immediate task settlement
        run: |
          go test ./controller -run '^TestPreConsumePolicyDatabaseMatrix$' -count=1 -v -timeout 180s
          for dialect in sqlite mysql postgres; do
            TEST_TASK_DB_DIALECT="$dialect" go test ./controller -run '^TestImmediateTaskSettlementDatabase$' -count=1 -v -timeout 180s
          done
      - name: MySQL clientFoundRows duplicate-request semantics
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&clientFoundRows=true
          TEST_BILLING_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&clientFoundRows=true
          TEST_POSTGRES_DSN: ''
          TEST_BILLING_POSTGRES_DSN: ''
        run: |
          go test ./model -run '^TestSubscriptionCycle' -count=1 -v -timeout 300s
          go test ./service -run '^TestBillingRecovery' -count=1 -v -timeout 300s

  release-image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: new-api-fork:fork-v0.2.0-${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build actual frontend and release container
        run: docker build --tag "$IMAGE_TAG" .
      - name: Run isolated container and check embedded frontend
        run: |
          mkdir -p /tmp/fork-release
          docker run -d --name fork-release-check -p 127.0.0.1:39300:3000 -e BATCH_UPDATE_ENABLED=false -e ENABLE_PPROF=false "$IMAGE_TAG"
          trap 'docker logs fork-release-check; docker rm -f fork-release-check' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:39300/api/status > /tmp/fork-release/status.json; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          curl -fsS http://127.0.0.1:39300/ > /tmp/fork-release/index.html
          test "$(wc -c < /tmp/fork-release/index.html)" -gt 1000
          grep -q 'fork-v' /tmp/fork-release/status.json
          docker exec fork-release-check /new-api billing-recovery --limit 10 > /tmp/fork-release/billing-recovery.json
          docker image inspect "$IMAGE_TAG" --format '{"id":"{{.Id}}","os":"{{.Os}}","architecture":"{{.Architecture}}"}' > /tmp/fork-release/image-metadata.json
          printf '%s\n' "$IMAGE_TAG" > /tmp/fork-release/image-tag.txt
          git rev-parse HEAD > /tmp/fork-release/build-commit.txt
          git rev-parse HEAD^{tree} > /tmp/fork-release/build-tree.txt
          docker save "$IMAGE_TAG" | gzip -n > /tmp/fork-release/new-api-fork-image.tar.gz
          (cd /tmp/fork-release && sha256sum new-api-fork-image.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-release-${{ github.sha }}
          path: /tmp/fork-release/
          retention-days: 14

  # FORK-04: fresh install, upgrade from upstream, restart, upstream on fork DB.
  migration-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
        scenario: [fresh, upgrade]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: newapi_mig
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newapi_mig
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build fork and upstream binaries
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          version=$(sh scripts/fork-version.sh)
          go build -ldflags "-X github.com/QuantumNous/new-api/common.Version=$version" -o /tmp/fork .
          git fetch --no-tags https://github.com/QuantumNous/new-api.git "$(cat UPSTREAM_COMMIT)"
          git worktree add /tmp/up FETCH_HEAD
          mkdir -p /tmp/up/web/dist && touch /tmp/up/web/dist/index.html
          (cd /tmp/up && go build -o /tmp/upstream .)
      - name: Run matrix
        run: |
          export MATRIX_DB='${{ matrix.db }}'
          export MATRIX_SCENARIO='${{ matrix.scenario }}'
          export EXPECTED_FORK_VERSION=$(sh scripts/fork-version.sh)
          if [ "${{ matrix.db }}" = postgres ]; then
            export SQL_DSN='postgres://postgres@127.0.0.1:5432/newapi_mig?sslmode=disable'
            export QUERY='psql -h 127.0.0.1 -U postgres -d newapi_mig -v ON_ERROR_STOP=1 -Atc'
          elif [ "${{ matrix.db }}" = mysql ]; then
            export SQL_DSN='root:root@tcp(127.0.0.1:3306)/newapi_mig'
            export QUERY='mysql -h127.0.0.1 -uroot -proot newapi_mig -N -B -e'
          else
            sudo apt-get update && sudo apt-get install -y sqlite3
            export SQL_DSN='local'
            export SQLITE_PATH='/tmp/mig/new-api.db'
            export QUERY='sqlite3 -batch /tmp/mig/new-api.db'
          fi
          mkdir -p /tmp/mig && cd /tmp/mig
          bash "$GITHUB_WORKSPACE/scripts/fork-migration-matrix.sh" /tmp/upstream /tmp/fork
